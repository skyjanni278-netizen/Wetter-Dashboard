<div class="page">
  <div class="page-header">
    <div class="page-title">
      <p class="kicker">Statistik</p>
      <h1>Rekorde</h1>
      <p>Heubach, Ostalbkreis</p>
    </div>
  </div>

  <div class="page-stack">
    @if (error()) {
      <app-error [message]="error()!" [retryable]="false" />
    }

    <!-- Laden: Skelett statt „aus 0 gespeicherten Tagen“ (V14) -->
    @if (loading()) {
      <app-loading>
        <div class="kpi-grid">
          @for (kicker of ['Heißester Tag', 'Kältester Tag', 'Regenreichster Tag', 'Längste Trockenperiode', 'Gespeicherte Messtage']; track kicker) {
            <app-kpi-card [kicker]="kicker" [loading]="true" />
          }
        </div>
      </app-loading>
    }

    @if (stats(); as s) {
      <div class="kpi-grid">
        <app-kpi-card kicker="Heißester Tag" [value]="s.hottestDay?.value" unit="°C"
                      [meta]="s.hottestDay ? formatDate(s.hottestDay.date) : null"
                      [reveal]="true" />
        <app-kpi-card kicker="Kältester Tag" [value]="s.coldestDay?.value" unit="°C"
                      [meta]="s.coldestDay ? formatDate(s.coldestDay.date) : null"
                      [reveal]="true" [revealIndex]="1" />
        <app-kpi-card kicker="Regenreichster Tag" [value]="s.rainiestDay?.value" unit="mm"
                      [meta]="s.rainiestDay ? formatDate(s.rainiestDay.date) : null"
                      [reveal]="true" [revealIndex]="2" />
        <app-kpi-card kicker="Längste Trockenperiode" [value]="s.driestStreak?.days" unit="Tage" [digits]="0"
                      [meta]="s.driestStreak ? formatDate(s.driestStreak.from) + ' – ' + formatDate(s.driestStreak.to) : null"
                      [reveal]="true" [revealIndex]="3" />
        <app-kpi-card kicker="Gespeicherte Messtage" [value]="s.totalDays" [digits]="0"
                      [reveal]="true" [revealIndex]="4" />
      </div>
    }
  </div>
</div>
