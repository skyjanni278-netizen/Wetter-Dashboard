<div class="page">
  <div class="page-header">
    <div class="page-title">
      <p class="kicker">Admin</p>
      <h1>Verwaltung</h1>
    </div>
  </div>

  <div class="page-stack">
    @if (state() === 'error') {
      <app-error [message]="error()" [details]="apiError() ? [apiError()!.message] : []" (retry)="retry()" />
    }

    @if (state() === 'loading' && !me()) {
      <app-loading label="Anmeldedaten werden geladen">
        <app-skeleton width="16rem" height="1.5em" />
      </app-loading>
    }

    @if (me(); as user) {
      <app-card class="admin-account" [edge]="false">
        <p class="admin-account-text">Angemeldet als <strong>{{ user.username }}</strong></p>
      </app-card>
    }
  </div>
</div>
